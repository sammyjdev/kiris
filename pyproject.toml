[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kiris"
version = "0.1.0"
description = "Keyword-Initiated Request Interpretation System - name-gated LLM voice assistant"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["kiris*"]
